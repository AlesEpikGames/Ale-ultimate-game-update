        const currentDate = new Date();
        const dateElement = document.querySelector('.current-date');
        const dateFormatter = new Intl.DateTimeFormat('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
        dateElement.textContent = dateFormatter.format(currentDate);
        dateElement.dateTime = [
            currentDate.getFullYear(),
            String(currentDate.getMonth() + 1).padStart(2, '0'),
            String(currentDate.getDate()).padStart(2, '0')
        ].join('-');

        const searchInput = document.querySelector('#game-search');
        const sortButton = document.querySelector('#sort-games');
        const gameList = document.querySelector('#game-list');
        const educationGameButtons = [...document.querySelectorAll('.game-button')];
        const noGamesMessage = document.querySelector('#no-games');
        const htmlGamesButton = document.querySelector('#html-games-button');
        const gamesCollectionMenu = document.querySelector('#games-collection-menu');
        const aleGamesChoice = document.querySelector('#ale-games-choice');
        const gnMathChoice = document.querySelector('#gn-math-choice');
        const htmlGameButtons = [];
        const pageTitle = document.querySelector('#page-title');
        let isAlphabetical = false;
        let showingHtmlGames = false;

        function addHtmlGame(title, file) {
            const gameButton = document.createElement('a');
            gameButton.className = 'game-button html-game-button';
            gameButton.href = `html-main/html-main/${encodeURIComponent(file)}`;
            gameButton.setAttribute('aria-label', title);
            gameButton.title = title;
            gameButton.dataset.gameTitle = title;
            gameButton.dataset.searchTerms = `${title} ${file}`.toLowerCase();
            const titleLabel = document.createElement('span');
            titleLabel.textContent = title;
            gameButton.append(titleLabel);
            gameButton.hidden = true;
            gameList.appendChild(gameButton);
            htmlGameButtons.push(gameButton);
        }

        window.htmlMainGames.forEach(game => {
            addHtmlGame(game.title, game.file);
        });

        function setGamesMode(showHtmlGames) {
            showingHtmlGames = showHtmlGames;
            aleGamesChoice.setAttribute('aria-pressed', String(!showHtmlGames));
            gnMathChoice.setAttribute('aria-pressed', String(showHtmlGames));
            filterGames(false);
        }

        function setGamesMenuOpen(isOpen) {
            gamesCollectionMenu.hidden = !isOpen;
            htmlGamesButton.setAttribute('aria-expanded', String(isOpen));
        }

        htmlGamesButton.addEventListener('click', () => {
            setGamesMenuOpen(gamesCollectionMenu.hidden);
        });

        aleGamesChoice.addEventListener('click', () => {
            searchInput.value = '';
            setGamesMode(false);
            setGamesMenuOpen(false);
        });

        gnMathChoice.addEventListener('click', () => {
            searchInput.value = '';
            setGamesMode(true);
            setGamesMenuOpen(false);
        });

        document.addEventListener('click', event => {
            if (!event.target.closest('.games-picker')) {
                setGamesMenuOpen(false);
            }
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !gamesCollectionMenu.hidden) {
                setGamesMenuOpen(false);
                htmlGamesButton.focus();
            }
        });

        function shuffleGames(buttons) {
            const shuffledButtons = [...buttons];
            for (let index = shuffledButtons.length - 1; index > 0; index--) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [shuffledButtons[index], shuffledButtons[randomIndex]] = [shuffledButtons[randomIndex], shuffledButtons[index]];
            }
            shuffledButtons.forEach(gameButton => gameList.appendChild(gameButton));
        }

        function filterGames(autoSwitch = true) {
            const searchText = searchInput.value.trim().toLowerCase();
            const educationMatches = educationGameButtons.filter(gameButton =>
                gameButton.dataset.gameTitle.toLowerCase().includes(searchText));
            const htmlMatches = htmlGameButtons.filter(gameButton =>
                gameButton.dataset.searchTerms.includes(searchText));
            if (autoSwitch && searchText && showingHtmlGames && !htmlMatches.length && educationMatches.length) {
                showingHtmlGames = false;
            } else if (autoSwitch && searchText && !showingHtmlGames && !educationMatches.length && htmlMatches.length) {
                showingHtmlGames = true;
            }

            htmlGamesButton.setAttribute('aria-pressed', String(showingHtmlGames));
            htmlGamesButton.textContent = 'G4m3s';
            htmlGamesButton.title = 'Choose a game collection';
            pageTitle.textContent = showingHtmlGames ? 'Gn-Math' : 'Education';
            document.title = pageTitle.textContent;
            gameList.setAttribute('aria-label', pageTitle.textContent);
            document.querySelector('.search-label').textContent = `Search ${pageTitle.textContent}`;
            searchInput.placeholder = `Search ${pageTitle.textContent}...`;

            const activeMatches = showingHtmlGames ? htmlMatches : educationMatches;
            if (searchText && activeMatches.length && isAlphabetical) {
                [...activeMatches]
                    .sort((firstGame, secondGame) => firstGame.dataset.gameTitle.localeCompare(secondGame.dataset.gameTitle))
                    .forEach(gameButton => gameList.appendChild(gameButton));
            }

            let visibleGames = 0;
            educationGameButtons.forEach(gameButton => {
                const isVisible = !showingHtmlGames && educationMatches.includes(gameButton);
                gameButton.hidden = !isVisible;
                if (isVisible) visibleGames++;
            });
            htmlGameButtons.forEach(gameButton => {
                const isVisible = showingHtmlGames && htmlMatches.includes(gameButton);
                gameButton.hidden = !isVisible;
            });
            noGamesMessage.hidden = visibleGames > 0 || (showingHtmlGames && htmlMatches.length > 0);
        }

        shuffleGames(educationGameButtons);
        searchInput.addEventListener('input', filterGames);
        filterGames();
        sortButton.addEventListener('click', () => {
            const activeGames = showingHtmlGames ? htmlGameButtons : educationGameButtons;
            if (!isAlphabetical) {
                [...activeGames]
                    .sort((firstGame, secondGame) => firstGame.dataset.gameTitle.localeCompare(secondGame.dataset.gameTitle))
                    .forEach(gameButton => gameList.appendChild(gameButton));
            } else {
                shuffleGames(activeGames);
            }
            isAlphabetical = !isAlphabetical;
            sortButton.textContent = isAlphabetical ? 'Shuffle' : 'A-Z';
        });
    </script>
</body>
</html>
